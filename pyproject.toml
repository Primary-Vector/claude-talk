[project]
name = "claude-talk"
version = "1.2.2"
description = "TTS plugin for Claude Code using Kokoro"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
]

[project.scripts]
claude-talk = "claude_talk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/claude_talk"]
